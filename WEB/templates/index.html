<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STM32 Localhost UI</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
    h1 { margin-bottom: 8px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    button { padding: 8px 12px; cursor: pointer; }
    input { padding: 8px; min-width: 240px; }
    #result { margin: 12px 0; font-weight: bold; }
    #log {
      border: 1px solid #ccc;
      background: #f7f7f7;
      padding: 10px;
      height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>STM32 Service Control</h1>
  <p>Localhost UI for TCP service on <code>127.0.0.1:5000</code>.</p>

  <div class="row">
    <button onclick="sendAction('STATUS')">STATUS</button>
    <button onclick="sendAction('GET_ALL')">GET_ALL</button>
    <button onclick="sendAction('GET_LAST')">GET_LAST</button>
    <button onclick="sendAction('DELETE')">DELETE</button>
  </div>

  <div class="row">
    <input id="filename" placeholder="LOG001.BIN">
    <button onclick="sendGetFile()">GET_FILE</button>
  </div>

  <div id="result">Ready.</div>
  <h3>Service Log</h3>
  <div id="log"></div>

  <script>
    async function sendAction(action, filename = "") {
      const response = await fetch("/api/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, filename })
      });
      const data = await response.json();
      const status = data.ok ? "OK" : "FAIL";
      document.getElementById("result").textContent = `${status}: ${data.message}`;
      await refreshLog();
    }

    async function sendGetFile() {
      const filename = document.getElementById("filename").value.trim();
      if (!filename) {
        document.getElementById("result").textContent = "FAIL: Filename is required for GET_FILE.";
        return;
      }
      await sendAction("GET_FILE", filename);
    }

    async function refreshLog() {
      const response = await fetch("/api/log");
      const data = await response.json();
      const log = document.getElementById("log");
      log.textContent = (data.lines || []).join("\n");
      log.scrollTop = log.scrollHeight;
    }

    setInterval(refreshLog, 1500);
    refreshLog();
  </script>
</body>
</html>
